      headerTagline: 'Tu viaje atemporal te espera',
      eyebrow: 'Gracias',
      greeting: 'Estimados Paco y Paca,',

      receivedDetails: 'Hemos recibido los siguientes datos:',

      labelGroom: 'Novio',
      labelBudget: 'Presupuesto',
      labelWeddingType: 'Tipo de boda',
      labelMeeting: 'Reunión',
      labelAdditionalInfo: 'Información adicional',

      footerAddress: '',

    const html = weddingCustomer({

    document.getElementById('preview').srcdoc = html;

</html>
